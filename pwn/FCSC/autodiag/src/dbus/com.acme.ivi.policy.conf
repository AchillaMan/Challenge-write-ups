<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="ivi">
    <allow own="com.acme.ivi.ServiceManager"/>
    <allow send_destination="com.acme.ivi.ServiceManager"/>
    <allow send_interface="com.acme.ivi.ServiceManager"/>
    <allow send_destination="org.freedesktop.DBus"/>
  </policy>
</busconfig>
